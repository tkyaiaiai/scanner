<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Barcode & QR Scanner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { -webkit-user-select: none; user-select: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
        #reader video { object-fit: cover !important; border-radius: 1rem; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <!-- 頂部標題列 -->
    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <h1 class="text-lg font-bold flex items-center gap-2">
            <i data-lucide="scan-line" class="text-indigo-400"></i> 流動條碼掃瞄器
        </h1>
        <div class="flex items-center gap-2">
            <button id="torch-btn" onclick="toggleTorch()" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-full text-slate-300 transition hidden" title="手電筒">
                <i data-lucide="flashlight" class="w-5 h-5"></i>
            </button>
        </div>
    </header>

    <!-- 主要內容區 (第一版經典佈局) -->
    <main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full gap-4 pb-24">
        
        <!-- Tab 1: 掃瞄頁面 -->
        <div id="tab-scan" class="flex flex-col gap-4">
            <!-- 鏡頭區域 -->
            <div class="relative w-full aspect-[3/4] bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col items-center justify-center">
                <div id="reader" class="w-full h-full"></div>

                <!-- 相冊上傳按鈕 -->
                <label class="absolute bottom-3 right-3 bg-slate-900/80 backdrop-blur-md border border-slate-700 text-xs px-3 py-2 rounded-xl flex items-center gap-1.5 text-slate-200 cursor-pointer shadow-lg active:scale-95 transition z-20">
                    <i data-lucide="image" class="w-4 h-4 text-indigo-400"></i> 相冊掃瞄
                    <input type="file" id="qr-input-file" accept="image/*" class="hidden" onchange="scanImageFile(this)">
                </label>
            </div>

            <!-- 第一版經典結果卡片 -->
            <div id="result-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg hidden">
                <div class="flex items-center justify-between mb-2">
                    <span id="result-format" class="text-xs font-semibold px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded">FORMAT</span>
                    <span class="text-xs text-slate-500" id="result-time">剛剛</span>
                </div>
                <div class="text-sm font-mono break-all bg-slate-950 p-3 rounded-xl border border-slate-800/80 mb-3 max-h-32 overflow-y-auto select-text" id="result-text">
                    掃瞄結果將顯示在此...
                </div>
                <div class="flex gap-2">
                    <button id="action-btn" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition flex items-center justify-center gap-2">
                        <i data-lucide="external-link" class="w-4 h-4"></i> 開啟連結
                    </button>
                    <button onclick="copyResult()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition flex items-center justify-center">
                        <i data-lucide="copy" class="w-4 h-4"></i>
                    </button>
                </div>
            </div>
        </div>

        <!-- Tab 2: 歷史紀錄頁面 -->
        <div id="tab-history" class="flex flex-col gap-3 hidden">
            <div class="flex items-center justify-between">
                <h2 class="text-sm font-semibold text-slate-300">掃瞄歷史紀錄</h2>
                <div class="flex gap-2">
                    <button onclick="exportCSV()" class="text-xs bg-indigo-600/20 border border-indigo-500/30 text-indigo-300 px-3 py-1.5 rounded-lg flex items-center gap-1">
                        <i data-lucide="download" class="w-3.5 h-3.5"></i> 匯出 CSV
                    </button>
                    <button onclick="clearHistory()" class="text-xs bg-red-500/10 border border-red-500/20 text-red-400 px-2.5 py-1.5 rounded-lg">
                        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            </div>
            <div id="history-list" class="flex flex-col gap-2 max-h-[60vh] overflow-y-auto"></div>
        </div>

    </main>

    <!-- 底部 Tab 列 (第一版 iOS 質感) -->
    <nav class="fixed bottom-0 left-0 right-0 bg-slate-900/90 backdrop-blur-md border-t border-slate-800 px-6 py-3 safe-bottom z-50 flex justify-around">
        <button id="nav-scan-btn" onclick="switchTab('scan')" class="flex flex-col items-center gap-1 text-indigo-400">
            <i data-lucide="scan" class="w-5 h-5"></i>
            <span class="text-[10px]">掃瞄</span>
        </button>
        <button id="nav-history-btn" onclick="switchTab('history')" class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200">
            <i data-lucide="history" class="w-5 h-5"></i>
            <span class="text-[10px]">歷史紀錄</span>
        </button>
    </nav>

    <script>
        lucide.createIcons();

        let lastResult = "";
        let html5QrCode = null;
        let isTorchOn = false;
        let scanHistory = JSON.parse(localStorage.getItem('scan_history') || '[]');

        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText !== lastResult) {
                lastResult = decodedText;

                // 震動反饋
                if (navigator.vibrate) navigator.vibrate(100);

                const formatName = (decodedResult.result && decodedResult.result.format) 
                    ? decodedResult.result.format.formatName 
                    : 'BARCODE';

                saveToHistory(decodedText, formatName);

                // 顯示第一版結果卡片
                document.getElementById('result-card').classList.remove('hidden');
                document.getElementById('result-format').innerText = formatName;
                document.getElementById('result-text').innerText = decodedText;
                document.getElementById('result-time').innerText = new Date().toLocaleTimeString();

                let actionBtn = document.getElementById('action-btn');
                if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                    actionBtn.innerHTML = '<i data-lucide="external-link" class="w-4 h-4"></i> 開啟連結';
                    actionBtn.onclick = () => window.open(decodedText, '_blank');
                } else {
                    actionBtn.innerHTML = '<i data-lucide="search" class="w-4 h-4"></i> 網路搜尋';
                    actionBtn.onclick = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(decodedText)}`, '_blank');
                }
                lucide.createIcons();

                // 2.5 秒冷卻時間，防止重複對焦觸發
                setTimeout(() => { lastResult = ""; }, 2500);
            }
        }

        function initScanner() {
            html5QrCode = new Html5Qrcode("reader");

            const formatsToSupport = [
                Html5QrcodeSupportedFormats.QR_CODE,
                Html5QrcodeSupportedFormats.PDF_417,
                Html5QrcodeSupportedFormats.CODE_128,
                Html5QrcodeSupportedFormats.CODE_39,
                Html5QrcodeSupportedFormats.EAN_13,
                Html5QrcodeSupportedFormats.EAN_8,
                Html5QrcodeSupportedFormats.UPC_A,
                Html5QrcodeSupportedFormats.UPC_E,
                Html5QrcodeSupportedFormats.DATA_MATRIX
            ];

            const config = {
                fps: 15,
                qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(h * 0.55) }),
                formatsToSupport: formatsToSupport
            };

            html5QrCode.start({ facingMode: "environment" }, config, onScanSuccess, () => {})
            .then(() => {
                try {
                    const track = html5QrCode.getRunningTrackCapabilities();
                    if (track.torch) document.getElementById('torch-btn').classList.remove('hidden');
                } catch(e) {}
            })
            .catch(err => console.error("相機啟動失敗: ", err));
        }

        function toggleTorch() {
            isTorchOn = !isTorchOn;
            html5QrCode.applyVideoConstraints({ advanced: [{ torch: isTorchOn }] })
            .then(() => {
                const btn = document.getElementById('torch-btn');
                btn.className = isTorchOn ? 'p-2 bg-indigo-600 text-white rounded-full transition' : 'p-2 bg-slate-800 text-slate-300 rounded-full transition';
            }).catch(e => alert("手電筒控制失敗"));
        }

        function scanImageFile(input) {
            if (input.files && input.files[0]) {
                html5QrCode.scanFile(input.files[0], true)
                .then(decodedText => {
                    onScanSuccess(decodedText, { result: { format: { formatName: 'IMAGE' } } });
                })
                .catch(err => alert("相片中未發現條碼"));
            }
        }

        function saveToHistory(text, format) {
            scanHistory.unshift({ text, format, time: new Date().toLocaleTimeString() });
            if (scanHistory.length > 100) scanHistory.pop();
            localStorage.setItem('scan_history', JSON.stringify(scanHistory));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (scanHistory.length === 0) {
                list.innerHTML = `<div class="text-center text-xs text-slate-500 py-12">暫無歷史紀錄</div>`;
                return;
            }
            list.innerHTML = scanHistory.map((item) => `
                <div class="bg-slate-900 border border-slate-800 p-3 rounded-xl flex items-center justify-between gap-3">
                    <div class="flex-1 overflow-hidden">
                        <div class="flex items-center gap-2 mb-1">
                            <span class="text-[10px] bg-indigo-500/20 text-indigo-300 font-semibold px-1.5 py-0.5 rounded">${item.format}</span>
                            <span class="text-[10px] text-slate-500">${item.time}</span>
                        </div>
                        <div class="text-xs font-mono text-slate-200 truncate">${item.text}</div>
                    </div>
                    <button onclick="navigator.clipboard.writeText('${item.text}').then(()=>alert('已複製！'))" class="p-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg shrink-0">
                        <i data-lucide="copy" class="w-3.5 h-3.5"></i>
                    </button>
                </div>
            `).join('');
            lucide.createIcons();
        }

        function copyResult() {
            const text = document.getElementById('result-text').innerText;
            navigator.clipboard.writeText(text).then(() => alert('已複製到剪貼簿！'));
        }

        function clearHistory() {
            if (confirm('確定清空歷史紀錄？')) {
                scanHistory = [];
                localStorage.removeItem('scan_history');
                renderHistory();
            }
        }

        function exportCSV() {
            if (scanHistory.length === 0) return alert('無紀錄');
            let csvContent = "data:text/csv;charset=utf-8,格式,內容,時間\n";
            scanHistory.forEach(h => {
                csvContent += `"${h.format}","${h.text.replace(/"/g, '""')}","${h.time}"\n`;
            });
            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `scan_history_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function switchTab(tab) {
            const scanTab = document.getElementById('tab-scan');
            const historyTab = document.getElementById('tab-history');
            const scanBtn = document.getElementById('nav-scan-btn');
            const historyBtn = document.getElementById('nav-history-btn');

            if (tab === 'scan') {
                scanTab.classList.remove('hidden');
                historyTab.classList.add('hidden');
                scanBtn.className = "flex flex-col items-center gap-1 text-indigo-400";
                historyBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200";
            } else {
                scanTab.classList.add('hidden');
                historyTab.classList.remove('hidden');
                historyBtn.className = "flex flex-col items-center gap-1 text-indigo-400";
                scanBtn.className = "flex flex-col items-center gap-1 text-slate-400 hover:text-slate-200";
                renderHistory();
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            initScanner();
            renderHistory();
        });
    </script>
</body>
</html>
