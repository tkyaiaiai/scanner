<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>高效能條碼掃瞄器</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- 引入穩定的 html5-qrcode 庫 -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { -webkit-user-select: none; user-select: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between">

    <header class="bg-slate-900 border-b border-slate-800 px-4 py-3 flex items-center justify-between sticky top-0 z-50">
        <h1 class="text-lg font-bold flex items-center gap-2">
            <i data-lucide="scan-line" class="text-indigo-400"></i> 條碼掃瞄器
        </h1>
    </header>

    <main class="flex-1 flex flex-col p-4 max-w-md mx-auto w-full gap-4 pb-24">
        
        <!-- html5-qrcode 專用容器 -->
        <div class="relative w-full aspect-[3/4] bg-black rounded-2xl overflow-hidden border border-slate-800 shadow-2xl flex flex-col items-center justify-center">
            <div id="reader" class="w-full h-full"></div>
        </div>

        <div id="result-card" class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg hidden">
            <div class="flex items-center justify-between mb-2">
                <span id="result-format" class="text-xs font-semibold px-2 py-0.5 bg-indigo-500/20 text-indigo-300 rounded">格式</span>
                <span class="text-xs text-slate-500">剛剛</span>
            </div>
            <div class="text-sm font-mono break-all bg-slate-950 p-3 rounded-xl border border-slate-800/80 mb-3 max-h-32 overflow-y-auto" id="result-text">
                掃瞄結果...
            </div>
            <div class="flex gap-2">
                <button id="action-btn" onclick="handleAction()" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl transition flex items-center justify-center gap-2">
                    <i data-lucide="external-link" class="w-4 h-4"></i> 開啟連結
                </button>
                <button onclick="copyResult()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 text-sm font-medium rounded-xl transition flex items-center justify-center">
                    <i data-lucide="copy" class="w-4 h-4"></i>
                </button>
            </div>
        </div>
    </main>

    <script>
        lucide.createIcons();
        let lastResult = "";

        function onScanSuccess(decodedText, decodedResult) {
            if (decodedText !== lastResult) {
                lastResult = decodedText;
                if (navigator.vibrate) navigator.vibrate(100);

                document.getElementById('result-card').classList.remove('hidden');
                document.getElementById('result-format').innerText = decodedResult.result.format.formatName || 'BARCODE';
                document.getElementById('result-text').innerText = decodedText;

                let actionBtn = document.getElementById('action-btn');
                if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
                    actionBtn.innerHTML = '<i data-lucide="external-link" class="w-4 h-4"></i> 開啟連結';
                    actionBtn.onclick = () => window.open(decodedText, '_blank');
                } else {
                    actionBtn.innerHTML = '<i data-lucide="search" class="w-4 h-4"></i> 網路搜尋';
                    actionBtn.onclick = () => window.open(`https://www.google.com/search?q=${encodeURIComponent(decodedText)}`, '_blank');
                }
                lucide.createIcons();

                setTimeout(() => { lastResult = ""; }, 3000);
            }
        }

        // 初始化掃瞄器，強制指定後置鏡頭
        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" },
            {
                fps: 15,
                qrbox: { width: 250, height: 250 },
                aspectRatio: 1.333334
            },
            onScanSuccess,
            (errorMessage) => {
                // 忽略未偵測到時的頻繁錯誤 log
            }
        ).catch(err => {
            alert("無法啟動相機: " + err);
        });

        function copyResult() {
            const text = document.getElementById('result-text').innerText;
            navigator.clipboard.writeText(text).then(() => {
                alert('已複製到剪貼簿！');
            });
        }
    </script>
</body>
</html>
